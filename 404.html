    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #F7F2E8; --card: #FFFDF8; --ink: #2E3B32; --ink-soft: #5A665C;
        --verde-deep: #26362B; --terra: #A85B45; --terra-deep: #95523D;
        --line: #E0D5BE; --miel: #D9B96E; color-scheme: light only;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--bg); color: var(--ink); padding: 24px;
        font-family: "Public Sans", system-ui, -apple-system, sans-serif;
        line-height: 1.6; -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        background: var(--card); border: 1px solid var(--line); border-radius: 24px;
        padding: 40px 26px; max-width: 560px; text-align: center;
        box-shadow: 0 18px 40px -22px rgba(52, 72, 59, .4);
      }
      @media (min-width: 640px) { main { padding: 54px 48px; } }
      .code { font-family: "DM Serif Display", Georgia, serif; font-size: 64px; line-height: 1; color: var(--terra); margin: 0; }
      h1 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: clamp(24px, 5.4vw, 32px); margin: 14px 0 10px; }
      p { color: var(--ink-soft); margin: 0 0 26px; font-size: 16.5px; }
      .actions { display: grid; gap: 10px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; min-height: 52px;
        padding: 14px 22px; border-radius: 999px; font-weight: 800; font-size: 16px;
        text-decoration: none; background: var(--terra); color: #FFF9F0;
      }
      .btn:hover { background: var(--terra-deep); }
      .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
      .btn-ghost:hover { background: #F3EEDF; }
      .foot { margin-top: 26px; font-size: 13px; color: var(--ink-soft); }
      .foot a { color: var(--terra-deep); font-weight: 600; }
      :focus-visible { outline: 3px solid var(--terra); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Esta página no existe</h1>
      <p>
        Puede que el enlace esté mal escrito o que la página haya cambiado de dirección.
        El pack de cursos sigue disponible desde la página principal.
      </p>
      <div class="actions">
        <a class="btn" href="index.html">Ver el pack — $9,99</a>
        <a class="btn btn-ghost" href="index.html#faq">Leer las preguntas frecuentes</a>
      </div>
      <p class="foot">
        ¿Necesitas ayuda? Escríbenos a
        <a href="mailto:jobvalidoseo@gmail.com">jobvalidoseo@gmail.com</a>.
      </p>
    </main>
  </body>
</html>
